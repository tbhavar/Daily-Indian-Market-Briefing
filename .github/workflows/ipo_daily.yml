name: Daily Mainboard IPO Briefing

on:
  schedule:
    - cron: '30 2 * * *' # 8:00 AM IST daily
  workflow_dispatch:

jobs:
  send_ipo_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip uninstall google-generativeai google -y
          pip install google-genai requests beautifulsoup4

      - name: Run IPO Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IPOALERTS_API_KEY: ${{ secrets.IPOALERTS_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python ipo_bot.py
