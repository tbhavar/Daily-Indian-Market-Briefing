name: Daily Mainboard IPO Briefing

on:
  schedule:
    - cron: '30 2 * * *' # 08:00 AM IST daily
  workflow_dispatch:

jobs:
  send_ipo_report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip uninstall google-generativeai google -y
          pip install -r requirements.txt

      - name: Run IPO Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IPOALERTS_API_KEY: ${{ secrets.IPOALERTS_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SUBSCRIBERS_CSV_URL: ${{ secrets.SUBSCRIBERS_CSV_URL }}
          GOOGLE_FORM_URL: ${{ secrets.GOOGLE_FORM_URL }}
        run: python main.py --type ipo

      - name: Commit report archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json notified_ipos.json || true
          git diff --cached --quiet || git commit -m "🚀 Update report archive [skip ci]"
          git push || true
