name: Closing Bell Analysis

on:
  schedule:
    - cron: "10 10 * * *" # 03:40 PM IST daily
  workflow_dispatch:

jobs:
  closing_report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip uninstall google-generativeai google -y
          pip install -r requirements.txt

      - name: Run Closing Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SUBSCRIBERS_CSV_URL: ${{ secrets.SUBSCRIBERS_CSV_URL }}
          GOOGLE_FORM_URL: ${{ secrets.GOOGLE_FORM_URL }}
        run: python main.py --type closing

      - name: Commit report archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json || true
          git diff --cached --quiet || git commit -m "📉 Update report archive [skip ci]"
          git push || true
