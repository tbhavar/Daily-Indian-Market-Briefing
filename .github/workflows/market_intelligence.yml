name: Market Intelligence Briefings

on:
  schedule:
    - cron: '45 3 * * *'  # 09:15 AM IST
    - cron: '15 10 * * *' # 03:45 PM IST
  workflow_dispatch:

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          pip uninstall google-generativeai google -y
          pip install google-genai requests beautifulsoup4
      - name: Detect Session & Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          HOUR=$(date +%H)
          if [ "$HOUR" -eq "03" ]; then python report_bot.py;
          elif [ "$HOUR" -eq "10" ]; then python closing_bot.py;
          fi
