name: Add new subscriber
on:
  issues:
    types: [opened]

jobs:
  add-subscriber:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Add subscriber
        if: startsWith(github.event.issue.title, 'New Subscription')
        run: |
          echo "${{ github.event.issue.body }}" >> Daily-Indian-Market-Briefing/mailing_list.txt
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Daily-Indian-Market-Briefing/mailing_list.txt
          git commit -m "Add new subscriber"
          git push
